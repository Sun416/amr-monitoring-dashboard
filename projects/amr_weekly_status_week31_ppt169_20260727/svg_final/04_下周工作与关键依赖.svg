    <circle cx="98" cy="294" r="15" fill="#D97706"/>
    <circle cx="98" cy="394" r="15" fill="#75B9D6"/>
    <circle cx="98" cy="494" r="15" fill="#75B9D6"/>
    <circle cx="98" cy="594" r="15" fill="#FFFFFF" stroke="#0076A8" stroke-width="3"/>
  </g>
  <g id="milestone-1">
