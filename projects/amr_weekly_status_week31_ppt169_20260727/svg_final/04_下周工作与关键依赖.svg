    <text x="924" y="567" font-family='Arial, Microsoft YaHei, sans-serif' font-size="28" font-weight="700" fill="#142434">Risks</text>
    <text x="860" y="608" font-family='Arial, Microsoft YaHei, sans-serif' font-size="17" fill="#526575">Refresh dynamic online data before presenting</text>
    <text x="860" y="630" font-family='Arial, Microsoft YaHei, sans-serif' font-size="17" fill="#526575">Keep AMR_03 inactive until confirmed</text>
