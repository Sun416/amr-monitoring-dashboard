    <circle cx="872" cy="310" r="7" fill="#D97706"/>
    <text x="896" y="318" font-family='Arial, Microsoft YaHei, sans-serif' font-size="22" fill="#142434">Agent access approval</text>
  </g>
  <g id="completion-panel">
