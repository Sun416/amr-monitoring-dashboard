    <text x="160" y="317" font-family='Arial, Microsoft YaHei, sans-serif' font-size="17" fill="#526575">Request SQL Server Agent roles and job permissions</text>
    <text x="766" y="286" text-anchor="end" font-family='Arial, Microsoft YaHei, sans-serif' font-size="16" font-weight="700" fill="#D97706">CURRENT BLOCKER</text>
