    <text x="160" y="417" font-family='Arial, Microsoft YaHei, sans-serif' font-size="17" fill="#526575">Fast snapshot ~1 min; historical analysis ~10 min</text>
    <!-- icon: tabler-outline/clock -->
  <g transform="translate(728, 372) scale(1.5)" fill="none" stroke="#0076A8" stroke-width="2">
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" />
    <path d="M12 7v5l3 3" />
  </g>
  </g>
  <g id="milestone-4">
    <rect x="132" y="454" width="662" height="80" fill="#FFFFFF" stroke="#C8DAE4" stroke-width="2"/>
    <rect x="132" y="454" width="8" height="80" fill="#75B9D6"/>
