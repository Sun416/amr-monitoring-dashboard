    <path d="M3 19a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
    <path d="M19 7a2 2 0 1 0 0 -4a2 2 0 0 0 0 4" />
    <path d="M11 19h5.5a3.5 3.5 0 0 0 0 -7h-8a3.5 3.5 0 0 1 0 -7h4.5" />
  </g>
    <text x="924" y="211" font-family='Arial, Microsoft YaHei, sans-serif' font-size="28" font-weight="700" fill="#142434">Key Dependencies</text>
    <line x1="860" y1="236" x2="1198" y2="236" stroke="#C8DAE4" stroke-width="2"/>
    <circle cx="872" cy="270" r="7" fill="#D97706"/>
