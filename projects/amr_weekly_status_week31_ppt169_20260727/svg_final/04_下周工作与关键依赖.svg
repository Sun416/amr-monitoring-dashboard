    <text x="160" y="617" font-family='Arial, Microsoft YaHei, sans-serif' font-size="17" fill="#526575">Start low-latency capture only after Agent jobs are stable</text>
    <text x="766" y="586" text-anchor="end" font-family='Arial, Microsoft YaHei, sans-serif' font-size="16" font-weight="700" fill="#0076A8">LATER PHASE</text>
