    <!-- icon: tabler-outline/calendar-check -->
  <g transform="translate(860, 376) scale(1.83333)" fill="none" stroke="#2E8B57" stroke-width="2">
    <path d="M11.5 21h-5.5a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v6" />
    <path d="M16 3v4" />
    <path d="M8 3v4" />
    <path d="M4 11h16" />
    <path d="M15 19l2 2l4 -4" />
  </g>
    <text x="924" y="407" font-family='Arial, Microsoft YaHei, sans-serif' font-size="28" font-weight="700" fill="#142434">Completion Criteria</text>
    <text x="860" y="452" font-family='Arial, Microsoft YaHei, sans-serif' font-size="22" fill="#142434">Scheduled jobs run reliably</text>
    <text x="860" y="480" font-family='Arial, Microsoft YaHei, sans-serif' font-size="17" fill="#526575">Freshness checks remain SUCCESS</text>
  </g>
  <g id="risk-panel">
    <rect x="834" y="512" width="390" height="122" fill="#FFFFFF" stroke="#C43D3D" stroke-width="2"/>
    <!-- icon: tabler-outline/alert-triangle -->
  <g transform="translate(860, 536) scale(1.83333)" fill="none" stroke="#C43D3D" stroke-width="2">
    <path d="M12 9v4" />
    <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" />
