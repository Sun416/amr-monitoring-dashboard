    <path d="M3 12h4l3 8l4 -16l3 8h4" />
  </g>
  </g>
  <g id="milestone-5">
    <rect x="132" y="554" width="662" height="80" fill="#FFFFFF" stroke="#0076A8" stroke-width="2"/>
    <rect x="132" y="554" width="8" height="80" fill="#0076A8"/>
