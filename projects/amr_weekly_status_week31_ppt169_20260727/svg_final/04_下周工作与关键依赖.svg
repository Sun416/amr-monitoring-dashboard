    <text x="160" y="217" font-family='Arial, Microsoft YaHei, sans-serif' font-size="17" fill="#526575">Investigate lagging robot_*_history anchors and restore updates</text>
    <text x="766" y="186" text-anchor="end" font-family='Arial, Microsoft YaHei, sans-serif' font-size="16" font-weight="700" fill="#0076A8">TOP PRIORITY</text>
